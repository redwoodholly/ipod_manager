
name: Build iPod Manager

on:
  workflow_dispatch:
  push:
    branches:
      - work/m4b-chapters

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install ms-gsl:x86-windows wil:x86-windows
          vcpkg integrate install
          if (-not (Test-Path "C:\vcpkg\installed\x86-windows\include\gsl\gsl")) {
            throw "Microsoft GSL headers were not installed"
          }
          
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ATL for MSVC v142
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          $args = @(
            "modify",
            "--installPath", "$vs",
            "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL",
            "--quiet",
            "--norestart",
            "--nocache"
          )

          for ($i = 1; $i -le 2; $i++) {
            Write-Host "ATL installation attempt $i"
            $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru -WindowStyle Hidden
            Write-Host "Installer exit code: $($process.ExitCode)"
          }

          $atl = Get-ChildItem "$vs\VC\Tools\MSVC" -Filter atlbase.h -Recurse |
            Where-Object { $_.FullName -match '\\14\.29\.' } |
            Select-Object -First 1

          if (-not $atl) {
            throw "ATL for MSVC v142 is still missing"
          }

          Write-Host "Correct ATL found: $($atl.FullName)"
          "ATL_INCLUDE=$($atl.DirectoryName)" >> $env:GITHUB_ENV
        
      - name: Build Release Win32
        shell: pwsh
        run: |
          $env:INCLUDE = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.51.36231\atlmfc\include;C:\vcpkg\installed\x86-windows\include;$env:INCLUDE"
          Write-Host "GSL include path: $env:INCLUDE"
          msbuild vc16/ipod_manager.sln /m /p:Configuration=Release /p:Platform=Win32

      - name: Locate build outputs
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter foo_dop.dll -Recurse
          if (-not $files) {
            throw "foo_dop.dll was not produced"
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          foreach ($file in $files) {
            Copy-Item $file.FullName package/
          }
          $crypt = Get-ChildItem -Path . -Filter iTunesCrypt.dll -Recurse
          foreach ($file in $crypt) {
            Copy-Item $file.FullName package/
          }
          Compress-Archive -Path package/* -DestinationPath foo_dop-win32.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_dop-win32
          path: foo_dop-win32.zip
          if-no-files-found: error

          
